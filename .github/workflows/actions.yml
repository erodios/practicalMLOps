name: Azure Python 3.12.15
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12.15
      uses: actions/setup-python@v7
      with:
        python-version: 3.12.15
    - name: Install depentencies
      run: |
        make install
    - name: Lint
      run: |
        make lint
    - name: Test
      run: |
        make test