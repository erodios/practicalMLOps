name: Azure Python 3.12.3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12.3
      uses: actions/setup-python@v1
      with:
        python-version: 3.12.3
    - name: Install depentencies
      run: |
        make Install
    - name: Lint
      run: |
        make lint
    - name: Test
      run: |
        make test